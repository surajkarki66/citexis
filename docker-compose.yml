name: citexis

x-python-build: &python-build
  context: .
  dockerfile: Dockerfile
  network: host

x-python-host: &python-host
  network_mode: host
  environment: &python-host-env
    ELASTICSEARCH_URL: http://127.0.0.1:9200
    REDIS_URL: redis://127.0.0.1:${REDIS_HOST_PORT:-6380}/0

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: citexis-elasticsearch
    network_mode: host
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: citexis-redis
    network_mode: host
    command: redis-server --port ${REDIS_HOST_PORT:-6380}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "${REDIS_HOST_PORT:-6380}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  es-init:
    build: *python-build
    <<: *python-host
    env_file:
      - .env
    environment:
      <<: *python-host-env
    command: python -m scripts.setup_es_index
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: "no"

  api:
    build: *python-build
    <<: *python-host
    container_name: citexis-api
    env_file:
      - .env
    environment:
      <<: *python-host-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      es-init:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build: *python-build
    <<: *python-host
    container_name: citexis-worker
    env_file:
      - .env
    environment:
      <<: *python-host-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: celery -A app.workers.celery_app worker --loglevel=info
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      es-init:
        condition: service_completed_successfully
      api:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      network: host
    container_name: citexis-frontend
    network_mode: host
    environment:
      VITE_PROXY_TARGET: http://127.0.0.1:8000
    depends_on:
      - api
    restart: unless-stopped

volumes:
  es_data:
  redis_data:
